# nudge configuration. Copy to ~/.config/nudge/config.toml and fill in.
# That file holds secrets: keep it out of git (chmod 600).

# Calendar IDs to watch. Find them with: python -m nudge calendars
calendars = [
    "you@gmail.com",
    "xxxxxxxxxxxxxxxx@group.calendar.google.com",
]

poll_minutes = 5      # how often to re-read Google Calendar
grace_minutes = 15    # still send a missed reminder if it's at most this late

# Discord is optional and off by default (Telegram covers it). To use it,
# uncomment and paste a webhook URL:
# Channel settings > Integrations > Webhooks > New Webhook > Copy URL
# [discord]
# webhook_url = "https://discord.com/api/webhooks/..."

[telegram]
# Optional. Create a bot with @BotFather, paste its token, send the bot any
# message, then run: python -m nudge telegram-chats   (prints your chat_id)
bot_token = "123456789:AA..."
chat_id = 123456789

[emoji]
# Optional. Built-in keyword rules (trash 🗑️, birthday 🎂, dentist 🦷, ...)
# apply unless builtin = false. Matching is case-insensitive at the start of
# a word, and your keywords below win over the built-ins.
# default = "⏰"
# builtin = true

[emoji.keywords]
# soccer = "⚽"
# trash = "🚮"


[morning]
# One message each morning: today's agenda, plus any upcoming events with NO
# popup notification (nudge would never fire for those). It sends even on an
# empty day, so a missing brief means the service is down.
# Put the tag in an event's description to keep it out of both parts.
# enabled = true
# time = "08:30"        # local, 24-hour
# agenda = true         # list today's events
# days = 14             # audit look-ahead
# via = ["telegram"]    # notifier names
# tag = "#nonudge"

[claude]
# console.anthropic.com key: parses "dentist thursday 3pm" into an event.
# Leave this out and nudge stays read-only (reminders still work).
api_key = "sk-ant-..."
# model = "claude-opus-5-5"
# workspace_id = "wrkspc_..."   # only if the key is org-level, not workspace-scoped

[create]
# Events created from Telegram.
# enabled = true
default_calendar = "xxxxxxxxxxxxxxxx@group.calendar.google.com"
alt_calendar = "you@gmail.com"   # the 📅 button on the preview switches to this
# duration_minutes = 30          # when no end time is given
# reminder_minutes = 10          # popup added to every created event

[health]
# healthchecks.io (or similar) ping URL. nudge pings it after every successful
# poll, and pings <url>/fail when a poll fails. If the pings stop, that service
# alerts you — the only check that survives the Pi losing power.
# Suggested check settings: period 5 minutes, grace 15 minutes.
ping_url = "https://hc-ping.com/..."
